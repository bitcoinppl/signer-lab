[workspace]
members = [
    "crates/signer-lab-core",
    "crates/signer-lab-cli",
    "crates/signer-lab-gpui",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Praveen Perera <me@praveenperera.com>"]
repository = "https://github.com/bitcoinppl/signer-lab"

[workspace.dependencies]
bdk_esplora = { version = "0.22.2", default-features = false, features = ["async-https-rustls", "tokio"] }
bdk_wallet = { version = "3.1.0", features = ["keys-bip39", "rusqlite"] }
bbqr = { version = "0.6.0", default-features = false }
bip39 = { version = "2.2.2", features = ["zeroize"] }
bitcoin = { version = "0.32.102", features = ["rand-std", "serde"] }
clap = { version = "4.6.6", features = ["derive"] }
color-eyre = "0.6.5"
directories = "6.0.0"
foundation-ur = { version = "0.4.0", default-features = false, features = ["std"] }
flume = "0.12.0"
gpui-kit = "=0.7.0"
jiff = { version = "0.2.35", features = ["serde"] }
keyring = "4.1.6"
minicbor = { version = "2.3.0", features = ["alloc", "std"] }
nokhwa = { version = "0.10.11", default-features = false, features = ["input-avfoundation", "output-threaded"] }
pubport = "0.6.0"
rand = "0.10.2"
rxing = "0.9.2"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toasty = { version = "0.10.0", features = ["serde", "turso"] }
toasty-driver-turso = "0.10.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
uuid = { version = "1.24.1", features = ["serde", "v4"] }
zeroize = { version = "1.9.0", features = ["derive"] }

# Keep all Cove crates on one revision so their shared types resolve together
cove-bdk = { git = "https://github.com/bitcoinppl/cove.git", rev = "025518b1767b6f5fba47a74bdf5afd53e9f91dc7" }
cove-bdk-progressive-scan = { git = "https://github.com/bitcoinppl/cove.git", rev = "025518b1767b6f5fba47a74bdf5afd53e9f91dc7" }
cove-bip39 = { git = "https://github.com/bitcoinppl/cove.git", rev = "025518b1767b6f5fba47a74bdf5afd53e9f91dc7" }
cove-ur = { git = "https://github.com/bitcoinppl/cove.git", rev = "025518b1767b6f5fba47a74bdf5afd53e9f91dc7" }
cove-util = { git = "https://github.com/bitcoinppl/cove.git", rev = "025518b1767b6f5fba47a74bdf5afd53e9f91dc7" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"

[profile.dev]
debug = "line-tables-only"
